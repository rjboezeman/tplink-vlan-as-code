# Example desired state for a fictional small office: a firewall, a rack switch, and two
# switches behind it (a studio and a workshop). Every name, address and VLAN here is made up;
# addresses are documentation ranges (RFC 5737 / RFC 7042).
#
# Copy this to network.toml (or any name: -c FILE) for your own setup. Top-level *.toml files
# other than pyproject.toml are git-ignored, so your real network never gets committed.
#
# Rules of the format (checked by `tplink-vlan validate`):
#   - A VLAN exists on a switch only where at least one of its ports is in it: the firmware
#     cannot hold an empty VLAN. VLAN 1 is built in and always exists. A port in no VLAN
#     (like "spare" below) is untagged in VLAN 1, because the switch puts it there; route
#     nothing to VLAN 1 and pvid = 1 keeps untagged frames out of your real VLANs.
#   - all_vlans_on_trunks = true makes every switch-to-switch cable carry every VLAN (tagged),
#     so every VLAN exists on every switch without spending access ports on it.
#   - Every port of every switch must be listed, unused ones too (explicit beats implicit).
#   - A port has at most one untagged VLAN; its PVID defaults to that VLAN.
#     A port with no untagged VLAN needs an explicit pvid.
#   - Each switch's uplink_port must carry the management VLAN, and both ends of a
#     switch-to-switch cable must carry the management VLAN the same way.
#   - Each switch has its own section: host, model, MAC, ports and credentials.
#     Passwords never go in this file. A switch reads TPLINK_PASSWORD_<NAME> (e.g.
#     TPLINK_PASSWORD_STUDIO) if set, else the shared TPLINK_PASSWORD, from the environment
#     or a .env file. Set password_env to name one variable explicitly (no fallback).

title = "Example small office"
management_vlan = 100
# all_vlans_on_trunks = true

[vlans.100]
name = "mgmt"
description = "switch and firewall management"

[vlans.200]
name = "staff"

[vlans.300]
name = "guest"
color = "#FB8C00"   # optional, diagram only

[vlans.400]
name = "cameras"
description = "isolated, no internet"

[switches.rack]
host = "192.0.2.10"
model = "TL-SG108PE"
mac = "00:00:5E:00:53:10"      # pin it: the tool refuses to configure a different device
uplink_port = 8                # towards the firewall
# username = "admin"           # default; per switch
# password_env = "RACK_SW_PW"  # default: TPLINK_PASSWORD_RACK, then TPLINK_PASSWORD

[switches.rack.ports]
1 = { name = "to studio",   tagged = [100, 200, 300, 400], pvid = 1 }   # pvid 1: untagged frames to unrouted VLAN 1
2 = { name = "to workshop", tagged = [100, 200, 400], pvid = 1 }
3 = { name = "NAS",         untagged = 200 }
4 = { name = "printer",     untagged = 200 }
5 = { name = "door cam",    untagged = 400 }
6 = { name = "spare",       pvid = 1 }
7 = { name = "admin desk",  untagged = 100 }
8 = { name = "firewall",    tagged = [100, 200, 300, 400], pvid = 1 }

[switches.studio]
host = "192.0.2.11"
model = "TL-SG108PE"
mac = "00:00:5E:00:53:11"
uplink_port = 8
upstream = { switch = "rack", port = 1 }

[switches.studio.ports]
1 = { name = "desk 1",   untagged = 200 }
2 = { name = "desk 2",   untagged = 200 }
3 = { name = "wifi",     untagged = 300, tagged = [100, 200] }
4 = { untagged = 200 }
5 = { untagged = 200 }
6 = { untagged = 300 }
7 = { untagged = 300 }
8 = { name = "uplink",   tagged = [100, 200, 300, 400], pvid = 1 }

[switches.workshop]
host = "192.0.2.12"
model = "TL-SG108PE"
mac = "00:00:5E:00:53:12"
uplink_port = 8
upstream = { switch = "rack", port = 2 }

[switches.workshop.ports]
1 = { name = "cam north", untagged = 400 }
2 = { name = "cam south", untagged = 400 }
3 = { name = "bench",     untagged = 200 }
4 = { untagged = 200 }
5 = { untagged = 200 }
6 = { untagged = 100 }
7 = { pvid = 1 }
8 = { name = "uplink",    tagged = [100, 200, 400], pvid = 1 }
